; php2shell interim settings for php.ini or a conf.d drop-in.
;   Debian/Ubuntu:  /etc/php/8.x/fpm/conf.d/99-php2shell.ini  (and /apache2/conf.d for mod_php)
;   RHEL family:    /etc/php.d/99-php2shell.ini
;   Docker (official images): /usr/local/etc/php/conf.d/zz-php2shell.ini
; Restart PHP-FPM / Apache / the container afterwards, then verify through the
; WEB SAPI (phpinfo or a health endpoint) — the CLI may read a different ini.
; Not a fix: update PHP.

session.upload_progress.enabled = Off
expose_php = Off
post_max_size = 64M
upload_max_filesize = 64M
max_multipart_body_parts = 1000
