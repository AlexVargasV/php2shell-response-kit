# =============================================================================
#  php2shell interim mitigation for nginx (+ PHP-FPM)
#  Rejects multipart/form-data requests before they reach PHP, except on
#  endpoints you allow or from networks you trust.
#
#  This is NOT a fix. It removes the most common delivery vehicle while you
#  patch. It WILL break file uploads that are not on the allow-list.
#  Read snippets/README.md to decide whether it fits your application.
# =============================================================================

# ---------------------------------------------------------------------------
# 1) http {} context — e.g. /etc/nginx/conf.d/00-php2shell.conf
# ---------------------------------------------------------------------------

map $http_content_type $php2shell_multipart {
    default                     0;
    "~*^multipart/form-data"    1;
}

# Endpoints that legitimately receive uploads. Uncomment / add yours.
map $uri $php2shell_upload_path {
    default 0;

    # WordPress (admin media, plugin/theme uploads, REST media)
    ~^/wp-admin/(async-upload|media-new|update|plugin-install|theme-install)\.php$  1;
    ~^/wp-json/wp/v2/media                                                        1;

    # Moodle: file picker and mobile app uploads. Note: Moodle forms that contain
    # file pickers are themselves multipart (course settings, assignments...).
    # Allow-listing paths is rarely enough for Moodle: prefer the network list
    # below, or skip this mitigation and patch.
    # ~^/repository/repository_ajax\.php$  1;
    # ~^/webservice/upload\.php$           1;

    # Laravel Livewire temporary uploads
    # ~^/livewire/upload-file$             1;
}

# Networks allowed to send multipart anywhere (office, VPN, CI). Add yours.
geo $php2shell_trusted_net {
    default         0;
    127.0.0.1/32    1;
    # 203.0.113.0/24  1;
}

map "$php2shell_multipart:$php2shell_upload_path:$php2shell_trusted_net" $php2shell_block {
    default    0;
    "1:0:0"    1;
}

# ---------------------------------------------------------------------------
# 2) every server {} that passes requests to PHP — before any location:
# ---------------------------------------------------------------------------
#
#    if ($php2shell_block) { return 403; }
#
# `if` with `return` at server level is safe in nginx. Reload:
#    nginx -t && systemctl reload nginx
#
# Test (expect 403 on a normal page, 200/302 on an allowed upload path):
#    curl -s -o /dev/null -w '%{http_code}\n' -F a=b https://example.com/
#
# Note: WordPress sites without pretty permalinks receive REST uploads on
# /?rest_route=/wp/v2/media, which this path list does not cover.
