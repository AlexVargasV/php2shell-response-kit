# =============================================================================
#  php2shell interim mitigation for Apache httpd (mod_php or PHP-FPM) and
#  LiteSpeed (reads the same rewrite rules from .htaccess).
#  Rejects multipart/form-data with 403 before PHP runs, except on allowed
#  endpoints or from trusted networks.
#
#  NOT a fix. It breaks uploads that are not allow-listed. See snippets/README.md.
#
#  Place it in the <VirtualHost> (preferred) or at the very TOP of the site's
#  .htaccess, before the CMS rewrite rules. Requires mod_rewrite.
# =============================================================================

<IfModule mod_rewrite.c>
    RewriteEngine On

    RewriteCond %{HTTP:Content-Type} ^multipart/form-data [NC]

    # --- allowed upload endpoints (WordPress examples) ---
    RewriteCond %{REQUEST_URI} !^/wp-admin/(async-upload|media-new|update|plugin-install|theme-install)\.php$ [NC]
    RewriteCond %{REQUEST_URI} !^/wp-json/wp/v2/media [NC]
    # Moodle (see README: usually insufficient on its own)
    # RewriteCond %{REQUEST_URI} !^/repository/repository_ajax\.php$ [NC]
    # RewriteCond %{REQUEST_URI} !^/webservice/upload\.php$ [NC]

    # --- trusted networks (office / VPN). Escape the dots. ---
    # RewriteCond %{REMOTE_ADDR} !^203\.0\.113\.
    # Behind Cloudflare or another proxy, use the real client IP instead
    # (mod_remoteip), otherwise REMOTE_ADDR is the proxy.

    RewriteRule ^ - [F,L]
</IfModule>

# Apply:  apachectl configtest && systemctl reload apache2   (or httpd)
# Test:   curl -s -o /dev/null -w '%{http_code}\n' -F a=b https://example.com/   -> 403
