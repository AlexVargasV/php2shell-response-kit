; =============================================================================
;  php2shell interim hardening for a PHP-FPM pool.
;  Append inside your pool section, e.g. [www] in
;    Debian/Ubuntu: /etc/php/8.x/fpm/pool.d/www.conf
;    RHEL family:   /etc/php-fpm.d/www.conf
;    Docker:        /usr/local/etc/php-fpm.d/zz-php2shell.conf  (new file with a [www] header)
;  then:  php-fpm -t  &&  systemctl restart php8.x-fpm   (restart, not reload)
;
;  NOT a fix: update PHP. These settings shrink the attack surface meanwhile.
; =============================================================================

; Removes the best-known trigger path of CVE-2026-109618. Must be set here or in
; php.ini; ini_set() from application code has no effect on this setting.
php_admin_flag[session.upload_progress.enabled] = off

; Keep request bodies as small as your application allows. Adjust to your
; largest legitimate upload (Moodle course backups, video, etc.).
php_admin_value[post_max_size] = 64M
php_admin_value[upload_max_filesize] = 64M

; Caps the number of multipart parts PHP will parse (available since 8.0.28 /
; 8.1.16 / 8.2.3). Default -1 means max_input_vars + max_file_uploads.
php_admin_value[max_multipart_body_parts] = 1000

; Defense in depth for CVE-2026-109619 (state carried from one request to the
; next on the same worker): recycle workers regularly. This shortens the window
; for reuse; it does not remove the bug.
pm.max_requests = 500

; Do NOT set memory_limit = -1 as a "mitigation": a single request could
; consume all server memory.
