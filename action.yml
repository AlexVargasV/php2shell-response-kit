name: php2shell pin scan
description: Fail the build when a repository pins a PHP version vulnerable to php2shell (CVE-2026-109618 / CVE-2026-109619).
author: php2shell-response-kit contributors
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    required: false
    default: "."
  strict:
    description: Treat warnings (floating tags, digest pins, provider-managed runtimes) as failures.
    required: false
    default: "false"
  exclude:
    description: Extra path regex to exclude (.git, vendor and node_modules are always excluded).
    required: false
    default: ""
  fail-on-findings:
    description: Set to "false" to report without failing the job.
    required: false
    default: "true"

outputs:
  failures:
    description: Number of failures found.
    value: ${{ steps.scan.outputs.failures }}
  warnings:
    description: Number of warnings found.
    value: ${{ steps.scan.outputs.warnings }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_FAIL: ${{ inputs.fail-on-findings }}
      run: |
        args=(-f github)
        [ "$INPUT_STRICT" = "true" ] && args+=(-s)
        [ -n "$INPUT_EXCLUDE" ] && args+=(-x "$INPUT_EXCLUDE")
        set +e
        out="$(bash "$GITHUB_ACTION_PATH/scripts/php-pin-scan.sh" "${args[@]}" "$INPUT_PATH")"
        rc=$?
        set -e
        printf '%s\n' "$out"
        last="$(printf '%s\n' "$out" | tail -1)"
        echo "failures=$(printf '%s' "$last" | sed -E 's/^php-pin-scan: ([0-9]+) failure.*/\1/')" >> "$GITHUB_OUTPUT"
        echo "warnings=$(printf '%s' "$last" | sed -E 's/.* ([0-9]+) warning.*/\1/')" >> "$GITHUB_OUTPUT"
        if [ "$rc" -eq 2 ]; then exit 2; fi
        if [ "$INPUT_FAIL" = "true" ]; then exit "$rc"; fi
        exit 0
