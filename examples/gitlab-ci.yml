# Add this job to your .gitlab-ci.yml.
# Prefer vendoring the script (or pinning a commit SHA in the
# URL) over fetching "main" on every run.

php2shell-pin-scan:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash coreutils grep sed gawk findutils curl
  script:
    - curl -fsSL https://raw.githubusercontent.com/AlexVargasV/php2shell-response-kit/main/scripts/php-pin-scan.sh -o /tmp/php-pin-scan.sh
    - bash /tmp/php-pin-scan.sh -f json . > php2shell-scan.json || STATUS=$?
    - bash /tmp/php-pin-scan.sh .
  artifacts:
    when: always
    paths: [php2shell-scan.json]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
