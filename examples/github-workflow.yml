# Copy to .github/workflows/php2shell.yml in YOUR repository.
# Fails pull requests that pin a PHP version vulnerable to php2shell, and
# re-checks every Monday so floating pins are revisited.
#
# Replace OWNER with the account that hosts php2shell-response-kit, and pin
# the action to a full commit SHA for supply-chain safety, e.g.
#   uses: OWNER/php2shell-response-kit@<40-char-sha>

name: php2shell

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: php2shell pin scan
        uses: OWNER/php2shell-response-kit@main
        with:
          path: "."
          strict: "false"        # "true" also fails on floating tags like php:8.3-fpm
          # exclude: "^./legacy/"

